name: CI

# Fast correctness gate on every push. Answers one question: does this work as
# written, on every runtime the tools claim to support. Anything needing a
# service, a fuzz budget, or another repository belongs in nightly or weekly.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The skill declares node >=20; both ends of that range are tested,
        # because "works on my Node" is how a vendored tool breaks a consumer.
        node: ["20", "24"]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Everything parses
        run: node scripts/check-syntax.mjs skills scripts contracts tests

      - name: Coordination state machine
        run: node --test skills/multi-agent-coordination/scripts/coord.test.mjs

      - name: canonical-json — the vector is reproduced by both references
        run: |
          node contracts/canonical-json/verify.mjs contracts/canonical-json/canonical.mjs
          python3 contracts/canonical-json/verify.py contracts/canonical-json/canonical.py

      - name: canonical-json — the vector is frozen, not regenerated in place
        run: |
          node contracts/canonical-json/build-vector.mjs
          git diff --exit-code contracts/canonical-json/vector.json

      - name: The documented divergences still exist
        run: node --test tests/known-divergences.mjs
